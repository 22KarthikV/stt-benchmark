[project]
name = "sttbench"
version = "0.1.0"
description = "Speech-to-text benchmark harness: WER, latency, streaming demo"
requires-python = ">=3.11"
dependencies = ["httpx", "websockets", "fastapi", "uvicorn", "jiwer"]

[project.optional-dependencies]
vosk = ["vosk"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sttbench*"]

[tool.setuptools.package-data]
"sttbench.stream_demo" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
